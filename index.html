<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Happy Birthday Vika</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;600;700&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
    -webkit-text-size-adjust:none;text-size-adjust:none;-webkit-user-select:none;user-select:none}
  html,body{height:100%;color:#3a0d12;overflow:hidden;touch-action:none;
    background:radial-gradient(circle at 50% 42%,#f8f5f1 0%,#f1eeea 55%,#e9e4de 100%)}
  body{display:flex;align-items:center;justify-content:center}

  #bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}

  /* kanvas 16:9, ukuran dihitung dari lebarnya (cqw) */
  .stage{
    position:relative;z-index:1;
    width:min(100vw,calc(100dvh*16/9));
    height:min(100dvh,calc(100vw*9/16));
    container-type:inline-size;overflow:hidden;
    display:flex;align-items:center;justify-content:center
  }
  .par{will-change:transform}
  .content{width:max-content;display:flex;flex-direction:column;align-items:center;transform-origin:center}

  /* tombol Next */
  .next{
    position:absolute;top:3.2cqw;right:3.5cqw;z-index:6;
    display:flex;align-items:center;gap:1cqw;
    padding:1cqw 2.4cqw 1cqw 2.9cqw;border-radius:999px;cursor:pointer;overflow:hidden;
    border:1px solid rgba(255,255,255,.5);
    background:linear-gradient(135deg,rgba(104,26,44,.95),rgba(58,13,18,.97));
    color:#fbf3ee;font-family:'Playfair Display',Georgia,serif;font-size:2cqw;letter-spacing:.06em;
    box-shadow:0 1cqw 3cqw rgba(58,13,18,.30),inset 0 1px 0 rgba(255,255,255,.28);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s;
    animation:btnIn 1s cubic-bezier(.2,.8,.2,1) 2.4s both,glow 3.2s ease-in-out 3.4s infinite
  }
  .next::after{content:'';position:absolute;inset:0;
    background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.38) 50%,transparent 70%);
    transform:translateX(-130%);animation:sheen 4s ease-in-out 3.6s infinite}
  .next svg{width:2.2cqw;height:2.2cqw;animation:nudge 1.8s ease-in-out 3.4s infinite}
  .next:active{transform:scale(.93)}

  .title{font-family:'Playfair Display',Georgia,serif;line-height:1.15;white-space:nowrap;color:#3a0d12;
    text-shadow:0 .2cqw 1.4cqw rgba(255,255,255,.65)}
  .sc{font-family:'Great Vibes',cursive;font-size:1.3em;line-height:.8;margin-right:.03em;display:inline-block}
  .ch{display:inline-block;opacity:0;transform:translateY(2cqw);
    animation:letterIn .7s cubic-bezier(.2,.8,.2,1) forwards}

  .row1{display:flex;align-items:flex-end;align-self:flex-start}
  .happy{font-size:10cqw}
  .cat-w{margin-left:2cqw;animation:pop 1s cubic-bezier(.3,1.4,.5,1) .9s both}
  .cat{height:21cqw;width:auto;display:block;animation:float 4s ease-in-out 2s infinite;
    -webkit-mask-image:linear-gradient(#000 86%,transparent);mask-image:linear-gradient(#000 86%,transparent)}

  .row2{display:flex;align-items:center;gap:2.5cqw;margin-top:1.5cqw}
  .letter-w{animation:drop 1s cubic-bezier(.3,1.3,.5,1) 1.6s both}
  .letter{width:18cqw;height:auto;display:block;animation:float 5s ease-in-out 2.8s infinite;
    filter:drop-shadow(0 1.2cqw 1.4cqw rgba(58,13,18,.25))}

  .right{display:flex;flex-direction:column;align-items:flex-start}
  .bday{font-size:10cqw;padding:.05em .15em .25em .12em;
    animation:wipe 1.3s cubic-bezier(.6,0,.2,1) 1.3s both}

  .name-w{animation:fadeIn .8s 2s both;margin-left:.12em}
  .name{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:3.3cqw;
    letter-spacing:.28em;text-transform:uppercase;white-space:nowrap;color:#3a0d12}
  .line{height:.28cqw;background:linear-gradient(90deg,#3a0d12,#a8546a);margin-top:1cqw;width:0;
    border-radius:1cqw;animation:grow 1s ease 2.3s forwards}

  .tag{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:500;
    font-size:2.5cqw;letter-spacing:.04em;white-space:nowrap;opacity:.9;margin-top:3.5cqw;
    animation:fadeIn 1.2s 2.8s both}

  .bh{position:absolute;pointer-events:none;z-index:7;line-height:1}

  @keyframes letterIn{to{opacity:1;transform:none}}
  @keyframes pop{0%{opacity:0;transform:scale(.3) rotate(-20deg)}
    60%{opacity:1;transform:scale(1.1) rotate(5deg)}100%{opacity:1;transform:none}}
  @keyframes wipe{from{opacity:0;clip-path:inset(-40% 100% -40% -20%)}
    to{opacity:1;clip-path:inset(-40% -20% -40% -20%)}}
  @keyframes drop{0%{opacity:0;transform:translateY(-8cqw) rotate(-12deg)}100%{opacity:1;transform:none}}
  @keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-.8cqw) rotate(1.5deg)}}
  @keyframes grow{to{width:100%}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes btnIn{from{opacity:0;transform:translateY(-2cqw) scale(.8)}to{opacity:1;transform:none}}
  @keyframes sheen{0%,55%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
  @keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(.45cqw)}}
  @keyframes glow{0%,100%{box-shadow:0 1cqw 3cqw rgba(58,13,18,.30),inset 0 1px 0 rgba(255,255,255,.28)}
    50%{box-shadow:0 1cqw 4.2cqw rgba(168,84,106,.55),inset 0 1px 0 rgba(255,255,255,.28)}}

  .rotate{display:none;position:fixed;inset:0;z-index:99;background:#f1eeea;
    align-items:center;justify-content:center;text-align:center;padding:24px;
    font-family:'Playfair Display',Georgia,serif;font-size:20px;line-height:1.5}
  @media (orientation:portrait){.rotate{display:flex}.stage{display:none}}
</style>
</head>
<body>
  <canvas id="bg"></canvas>

  <div class="stage" id="stage">
    <button class="next" id="next">
      <span>Next</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>

    <div class="par" id="par">
      <div class="content" id="content">
        <div class="row1">
          <div class="title happy" id="happy"><span class="sc ch" style="animation-delay:.1s">H</span></div>
          <div class="cat-w"><img class="cat" src="kucing.png?v=9" alt=""></div>
        </div>

        <div class="row2">
          <div class="letter-w"><img class="letter" src="surat.png?v=9" alt=""></div>
          <div class="right">
            <div class="title bday"><span class="sc">B</span>irthday</div>
            <div class="name-w"><div class="name">Vika Arianti</div><div class="line"></div></div>
          </div>
        </div>

        <p class="tag">"A little digital memory book built with love, just for you."</p>
      </div>
    </div>
  </div>

  <div class="rotate">Miringkan HP ke samping<br>(mode landscape) ya</div>

<script>
  var NEXT_URL = ''; // isi nanti, misal 'halaman2.html'
  try{ screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape').catch(function(){}); }catch(e){}

  var st=document.getElementById('stage');

  // huruf "appy" muncul satu per satu
  var h=document.getElementById('happy');
  'appy'.split('').forEach(function(c,i){
    var s=document.createElement('span');
    s.className='ch'; s.textContent=c; s.style.animationDelay=(0.3+i*0.12)+'s';
    h.appendChild(s);
  });

  // pengaman: kelompok selalu muat di layar dan di tengah
  var c=document.getElementById('content');
  function fit(){
    c.style.transform='none';
    var s=Math.min(1,(st.clientWidth*0.9)/c.scrollWidth,(st.clientHeight*0.88)/c.scrollHeight);
    c.style.transform='scale('+s+')';
  }
  window.addEventListener('load',fit);
  window.addEventListener('resize',fit);
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(fit);}
  Array.prototype.forEach.call(document.images,function(i){i.addEventListener('load',fit);});

  /* ================= SHADER LATAR ================= */
  var FS=[
  '#ifdef GL_FRAGMENT_PRECISION_HIGH',
  'precision highp float;',
  '#else',
  'precision mediump float;',
  '#endif',
  'uniform vec2 uRes;uniform float uTime;uniform vec3 uPt;uniform float uBurst;uniform vec2 uBP;',
  'float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}',
  'float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);',
  ' return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x),mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x),f.y);}',
  'float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*noise(p);p=p*2.02+vec2(1.7,9.2);a*=.5;}return v;}',
  'float bokeh(vec2 p,float sc,float spd,float seed){',
  ' vec2 g=p*sc+vec2(seed*7.,-uTime*spd);vec2 id=floor(g);vec2 f=fract(g)-.5;',
  ' float h=hash(id+seed);',
  ' vec2 off=(vec2(hash(id+1.3),hash(id+7.7))-.5)*.5;',
  ' float rad=.08+.14*hash(id+3.1);float d=length(f-off);',
  ' float tw=.5+.5*sin(uTime*(.6+h*1.4)+h*6.28);',
  ' float on=step(.55,h)*tw;',
  ' return smoothstep(rad,rad*.2,d)*on*.12+smoothstep(rad*.35,0.,d)*on*.3;}',
  'void main(){',
  ' vec2 uv=gl_FragCoord.xy/uRes;',
  ' vec2 p=(gl_FragCoord.xy-.5*uRes)/min(uRes.x,uRes.y);',
  ' float t=uTime*.06;',
  ' vec2 q=vec2(fbm(p*1.4+t),fbm(p*1.4+vec2(5.2,1.3)-t));',
  ' vec2 r=vec2(fbm(p*1.6+2.*q+vec2(1.7,9.2)+t*1.5),fbm(p*1.6+2.*q+vec2(8.3,2.8)-t));',
  ' float f=fbm(p*1.2+2.5*r);',
  ' vec3 cream=vec3(.949,.937,.918);vec3 blush=vec3(.965,.855,.862);',
  ' vec3 champ=vec3(.937,.867,.745);vec3 rose=vec3(.867,.655,.71);',
  ' vec3 col=mix(cream,blush,smoothstep(.25,.75,f));',
  ' col=mix(col,champ,smoothstep(.45,.9,r.x)*.55);',
  ' col=mix(col,rose,smoothstep(.6,1.,q.y*f*1.6)*.2);',
  ' float d0=length(p*vec2(.8,1.));',
  ' col+=vec3(1.,.97,.93)*.32*exp(-d0*d0*2.2);',
  ' float b=bokeh(p,5.,.05,0.)+bokeh(p,9.,.08,1.)+bokeh(p,14.,.12,2.);',
  ' col+=vec3(1.,.9,.72)*b;',
  ' vec2 pp=p-uPt.xy;float dd=length(pp);float age=uPt.z;',
  ' float ring=exp(-pow((dd-age*.35)*9.,2.))*exp(-age*1.6);',
  ' float glow=exp(-dd*dd*30.)*exp(-age*2.);',
  ' col+=vec3(1.,.9,.88)*(ring*.28+glow*.18);',
  ' float bd=length(p-uBP);',
  ' float br=exp(-pow((bd-uBurst*.9)*6.,2.))*exp(-uBurst*1.2);',
  ' col+=vec3(1.,.82,.84)*br*.5;',
  ' vec2 vq=uv-.5;col*=1.-.2*dot(vq,vq)*2.;',
  ' col+=(hash(gl_FragCoord.xy+fract(uTime))-.5)*.03;',
  ' gl_FragColor=vec4(clamp(col,0.,1.),1.);}'
  ].join('\n');

  var cv=document.getElementById('bg'), gl=null, U={}, W=innerWidth, H=innerHeight;
  var t0=performance.now(), ptT=-99, ptX=0, ptY=0, buT=-99, bpX=0, bpY=0;
  try{ gl=cv.getContext('webgl',{antialias:false,alpha:false,powerPreference:'low-power'})||cv.getContext('experimental-webgl'); }catch(e){}

  function sh(type,src){var s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){console.warn(gl.getShaderInfoLog(s));return null;}return s;}

  if(gl){
    var v=sh(gl.VERTEX_SHADER,'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}');
    var f=sh(gl.FRAGMENT_SHADER,FS);
    if(v&&f){
      var pr=gl.createProgram();gl.attachShader(pr,v);gl.attachShader(pr,f);gl.linkProgram(pr);gl.useProgram(pr);
      var buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
      gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
      var loc=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
      ['uRes','uTime','uPt','uBurst','uBP'].forEach(function(n){U[n]=gl.getUniformLocation(pr,n);});
    }else{gl=null;}
  }
  if(!gl){cv.style.display='none';}

  function resize(){
    W=innerWidth;H=innerHeight;
    if(!gl)return;
    var s=Math.min(window.devicePixelRatio||1,1.5)*0.6; // 0.6 = ringan; naikkan kalau mau lebih tajam
    cv.width=Math.max(2,Math.floor(W*s));cv.height=Math.max(2,Math.floor(H*s));
    gl.viewport(0,0,cv.width,cv.height);
  }
  window.addEventListener('resize',resize);resize();

  function toP(x,y){var m=Math.min(W,H);return [(x-W/2)/m,-(y-H/2)/m];}

  // sentuhan: riak cahaya + parallax halus
  var par=document.getElementById('par'), tx=0,ty=0,cx=0,cy=0;
  function onPt(e,isDown){
    var p=toP(e.clientX,e.clientY);ptX=p[0];ptY=p[1];
    if(isDown)ptT=(performance.now()-t0)/1000;
    tx=(e.clientX/W-.5)*-1.4;ty=(e.clientY/H-.5)*-1.0; // dalam persen lebar stage
  }
  window.addEventListener('pointerdown',function(e){onPt(e,true);});
  window.addEventListener('pointermove',function(e){onPt(e,false);});

  function frame(now){
    var t=(now-t0)/1000;
    cx+=(tx-cx)*.06;cy+=(ty-cy)*.06;
    par.style.transform='translate3d('+(cx*st.clientWidth/100)+'px,'+(cy*st.clientWidth/100)+'px,0)';
    if(gl){
      gl.uniform2f(U.uRes,cv.width,cv.height);
      gl.uniform1f(U.uTime,t);
      gl.uniform3f(U.uPt,ptX,ptY,t-ptT);
      gl.uniform1f(U.uBurst,t-buT);
      gl.uniform2f(U.uBP,bpX,bpY);
      gl.drawArrays(gl.TRIANGLES,0,3);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ================= TOMBOL NEXT ================= */
  var HC=['#8b1e2d','#c9808a','#d9a07c','#e7b6bf'];
  function heart(cx,cy,i){
    var el=document.createElement('span');el.className='bh';el.textContent='\u2665';
    var u=st.clientWidth/100;
    el.style.left=cx+'px';el.style.top=cy+'px';
    el.style.fontSize=((1.6+Math.random()*1.8)*u)+'px';el.style.color=HC[i%HC.length];
    st.appendChild(el);
    var a=-Math.PI/2+(Math.random()-.5)*Math.PI*1.6, d=(7+Math.random()*13)*u, rot=(Math.random()-.5)*80;
    el.animate([
      {transform:'translate(-50%,-50%) scale(.3)',opacity:1},
      {transform:'translate(calc(-50% + '+(Math.cos(a)*d)+'px),calc(-50% + '+(Math.sin(a)*d)+'px)) scale(1) rotate('+rot+'deg)',opacity:0}
    ],{duration:1100+Math.random()*700,easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish=function(){el.remove();};
  }
  document.getElementById('next').addEventListener('click',function(){
    var r=this.getBoundingClientRect(), sr=st.getBoundingClientRect();
    var bx=r.left-sr.left+r.width/2, by=r.top-sr.top+r.height/2;
    for(var i=0;i<16;i++)heart(bx,by,i);
    var p=toP(r.left+r.width/2,r.top+r.height/2);bpX=p[0];bpY=p[1];
    buT=(performance.now()-t0)/1000;
    if(NEXT_URL){setTimeout(function(){location.href=NEXT_URL;},900);}
  });

  // matikan zoom
  ['gesturestart','gesturechange','gestureend'].forEach(function(e){
    document.addEventListener(e,function(ev){ev.preventDefault();});
  });
  document.addEventListener('touchmove',function(ev){if(ev.touches.length>1)ev.preventDefault();},{passive:false});
  var last=0;
  document.addEventListener('touchend',function(ev){var n=Date.now();if(n-last<350)ev.preventDefault();last=n;},{passive:false});
</script>
</body>
</html>
