<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Happy Birthday Vika</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;600;700&family=Cormorant+Garamond:ital,wght@1,500&family=Dancing+Script:wght@700&family=Lora:wght@500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
    -webkit-text-size-adjust:none;text-size-adjust:none;-webkit-user-select:none;user-select:none}
  html,body{height:100%;color:#3a0d12;overflow:hidden;touch-action:none;
    background:#000}
  body{display:flex;align-items:center;justify-content:center}

  #bg,#fg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
  #bg{z-index:0}
  #fg{z-index:1}

  .stage{
    position:relative;z-index:0;
    width:min(92vw,calc(86dvh*1.45));aspect-ratio:1.45;
    background:linear-gradient(145deg,#f9d3dd 0%,#f3bccb 55%,#eeaabd 100%);
    border-radius:6vw;border:1px solid rgba(255,255,255,.28);
    box-shadow:0 0 7vw rgba(240,140,170,.22),inset 0 0 8vw rgba(255,255,255,.22);
    container-type:inline-size;overflow:hidden
  }

  .next{
    position:absolute;top:3.2cqw;right:3.5cqw;z-index:6;
    display:flex;align-items:center;gap:1cqw;
    padding:1cqw 2.4cqw 1cqw 2.9cqw;border-radius:999px;cursor:pointer;overflow:hidden;
    border:1px solid rgba(255,255,255,.5);
    background:linear-gradient(135deg,rgba(104,26,44,.95),rgba(58,13,18,.97));
    color:#fbf3ee;font-family:'Playfair Display',Georgia,serif;font-size:2cqw;letter-spacing:.06em;
    box-shadow:0 1cqw 3cqw rgba(58,13,18,.30),inset 0 1px 0 rgba(255,255,255,.28);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s;
    animation:btnIn 1s cubic-bezier(.2,.8,.2,1) 3s both,glow 3.2s ease-in-out 4s infinite
  }
  .next::after{content:'';position:absolute;inset:0;
    background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.38) 50%,transparent 70%);
    transform:translateX(-130%);animation:sheen 4s ease-in-out 4.2s infinite}
  .next svg{width:2.2cqw;height:2.2cqw;animation:nudge 1.8s ease-in-out 4s infinite}
  .next:active{transform:scale(.93)}

  .bh{position:absolute;pointer-events:none;z-index:7;line-height:1}

  @keyframes btnIn{from{opacity:0;transform:translateY(-2cqw) scale(.8)}to{opacity:1;transform:none}}
  @keyframes sheen{0%,55%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
  @keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(.45cqw)}}
  @keyframes glow{0%,100%{box-shadow:0 1cqw 3cqw rgba(58,13,18,.30),inset 0 1px 0 rgba(255,255,255,.28)}
    50%{box-shadow:0 1cqw 4.2cqw rgba(168,84,106,.55),inset 0 1px 0 rgba(255,255,255,.28)}}

  .rotate{display:none;position:fixed;inset:0;z-index:99;background:#f1eeea;
    align-items:center;justify-content:center;text-align:center;padding:24px;
    font-family:'Playfair Display',Georgia,serif;font-size:20px;line-height:1.5}
  .rotate{display:none!important}
  .next{display:none!important}
  #p2{position:absolute;inset:0;z-index:5;display:flex;align-items:center;padding:0 5cqw;
    opacity:0;pointer-events:none;transition:opacity 1.4s ease}
  #p2.on{opacity:1}
  #p2 .foto{flex:0 0 auto;height:60cqw;aspect-ratio:3/4;border-radius:3cqw;overflow:hidden;
    border:.5cqw solid rgba(255,255,255,.85);box-shadow:0 2cqw 6cqw rgba(104,26,44,.28),0 0 8cqw rgba(255,255,255,.55),0 0 0 1.4cqw rgba(255,255,255,.35),0 0 0 2.6cqw rgba(255,255,255,.18);
    opacity:0;transform:translateX(-6cqw) scale(.94);
    transition:transform 1.6s cubic-bezier(.2,.8,.2,1) .3s,opacity 1.4s ease .3s}
  #p2.on .foto{opacity:1;transform:none}
  #p2 .foto img{width:100%;height:100%;object-fit:cover;object-position:50% 25%;display:block}
  #p2 .teks{flex:1 1 0;min-width:0;margin-left:5cqw;text-align:left;color:#4a1220}
  #p2 .judul{font-family:'Dancing Script','Great Vibes',cursive;font-weight:700;font-size:6.6cqw;line-height:1.1;color:#7a1f35;text-shadow:0 .3cqw 1cqw rgba(255,255,255,.6);
    margin-bottom:2.2cqw;opacity:0;transition:opacity 1.2s ease .8s}
  #p2 .isi{font-family:'Lora',Georgia,serif;font-weight:500;color:#5a1a2b;
    font-size:2.9cqw;line-height:1.65}
  #p2 .isi span{opacity:0;transition:opacity 1.2s ease}
  #p2.on .judul,#p2.on .isi span{opacity:1}
  #p2::before{content:'';position:absolute;inset:0;z-index:-1;
    background:radial-gradient(circle at 22% 50%,rgba(255,255,255,.55),transparent 42%),
    radial-gradient(circle at 88% 10%,rgba(255,214,224,.9),transparent 38%),
    radial-gradient(circle at 78% 98%,rgba(238,160,184,.55),transparent 40%)}
  #p2 .fl{position:absolute;z-index:-1;bottom:-6cqw;opacity:0;pointer-events:none;animation:flo 9s linear infinite}
  @keyframes flo{0%{transform:translateY(0) rotate(0);opacity:0}15%{opacity:.75}100%{transform:translateY(-80cqw) rotate(40deg);opacity:0}}
</style>
</head>
<body>
  <canvas id="bg"></canvas>
  <canvas id="fg"></canvas>

  <div class="stage" id="stage">
    <button class="next" id="next">
      <span>Next</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
    <div id="p2">
      <div class="foto"><img src="cewe.jpg?v=1" alt=""></div>
      <div class="teks">
        <div class="judul">Happy Birthday</div>
        <div class="isi"><span>Selamat ulang tahun yang ke 19 sayanggg,</span> <span>aku bersyukur punya kamu di hidup aku,</span> <span>semoga di umur yang baru ini kamu selalu sehat, dilindungi Allah, dan hatinya makin tenang.</span> <span>Apa yang kamu impikan semoga dimudahkan satu per satu yaawww❤️❤️❤️</span></div>
      </div>
    </div>
  </div>

  <div class="rotate">Miringkan HP ke samping<br>(mode landscape) ya</div>

<script>
var NEXT_URL = ''; // isi nanti, misal 'halaman2.html'

var st=document.getElementById('stage');
var DPR=Math.min(window.devicePixelRatio||1,2);
var W=innerWidth,H=innerHeight;
var t0=performance.now(), aT0=null;
var SERIF="'Playfair Display',Georgia,serif", SCRIPT="'Great Vibes',cursive", ITAL="'Cormorant Garamond',Georgia,serif";

function compile(gl,type,src){var s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){console.warn(gl.getShaderInfoLog(s));return null;}return s;}
function program(gl,vs,fs){
  var v=compile(gl,gl.VERTEX_SHADER,vs),f=compile(gl,gl.FRAGMENT_SHADER,fs);
  if(!v||!f)return null;
  var p=gl.createProgram();gl.attachShader(p,v);gl.attachShader(p,f);gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))return null;
  return p;
}
var PREC='#ifdef GL_FRAGMENT_PRECISION_HIGH\nprecision highp float;\n#else\nprecision mediump float;\n#endif\n';

/* ================= SHADER LATAR ================= */
var BGV='attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
var BGF=PREC+[
'uniform vec2 uRes;uniform float uTime;uniform vec3 uPt;uniform float uBurst;uniform vec2 uBP;',
'float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}',
'float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);',
' return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x),mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x),f.y);}',
'float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*noise(p);p=p*2.02+vec2(1.7,9.2);a*=.5;}return v;}',
'float bokeh(vec2 p,float sc,float spd,float seed){',
' vec2 g=p*sc+vec2(seed*7.,-uTime*spd);vec2 id=floor(g);vec2 f=fract(g)-.5;',
' float h=hash(id+seed);vec2 off=(vec2(hash(id+1.3),hash(id+7.7))-.5)*.5;',
' float rad=.08+.14*hash(id+3.1);float d=length(f-off);',
' float tw=.5+.5*sin(uTime*(.6+h*1.4)+h*6.28);float on=step(.55,h)*tw;',
' return smoothstep(rad,rad*.2,d)*on*.12+smoothstep(rad*.35,0.,d)*on*.3;}',
'void main(){',
' vec2 uv=gl_FragCoord.xy/uRes;vec2 p=(gl_FragCoord.xy-.5*uRes)/min(uRes.x,uRes.y);',
' float t=uTime*.06;',
' vec2 q=vec2(fbm(p*1.4+t),fbm(p*1.4+vec2(5.2,1.3)-t));',
' vec2 r=vec2(fbm(p*1.6+2.*q+vec2(1.7,9.2)+t*1.5),fbm(p*1.6+2.*q+vec2(8.3,2.8)-t));',
' float f=fbm(p*1.2+2.5*r);',
' vec3 cream=vec3(.949,.937,.918);vec3 blush=vec3(.965,.855,.862);',
' vec3 champ=vec3(.937,.867,.745);vec3 rose=vec3(.867,.655,.71);',
' vec3 col=mix(cream,blush,smoothstep(.25,.75,f));',
' col=mix(col,champ,smoothstep(.45,.9,r.x)*.55);',
' col=mix(col,rose,smoothstep(.6,1.,q.y*f*1.6)*.2);',
' float d0=length(p*vec2(.8,1.));col+=vec3(1.,.97,.93)*.32*exp(-d0*d0*2.2);',
' float b=bokeh(p,5.,.05,0.)+bokeh(p,9.,.08,1.)+bokeh(p,14.,.12,2.);',
' col+=vec3(1.,.9,.72)*b;',
' vec2 pp=p-uPt.xy;float dd=length(pp);float age=uPt.z;',
' float ring=exp(-pow((dd-age*.35)*9.,2.))*exp(-age*1.6);float glow=exp(-dd*dd*30.)*exp(-age*2.);',
' col+=vec3(1.,.9,.88)*(ring*.28+glow*.18);',
' float bd=length(p-uBP);float br=exp(-pow((bd-uBurst*.9)*6.,2.))*exp(-uBurst*1.2);',
' col+=vec3(1.,.82,.84)*br*.5;',
' vec2 vq=uv-.5;col*=1.-.2*dot(vq,vq)*2.;',
' col+=(hash(gl_FragCoord.xy+fract(uTime))-.5)*.03;',
' gl_FragColor=vec4(clamp(col,0.,1.),1.);}'
].join('\n');

var cv=document.getElementById('bg'), bgl=null, BU={};
var ptT=-99, ptX=0, ptY=0, buT=-99, bpX=0, bpY=0;

if(bgl){
  var bp=program(bgl,BGV,BGF);
  if(bp){
    bgl.useProgram(bp);
    var bb=bgl.createBuffer();bgl.bindBuffer(bgl.ARRAY_BUFFER,bb);
    bgl.bufferData(bgl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),bgl.STATIC_DRAW);
    var bl=bgl.getAttribLocation(bp,'a');bgl.enableVertexAttribArray(bl);bgl.vertexAttribPointer(bl,2,bgl.FLOAT,false,0,0);
    ['uRes','uTime','uPt','uBurst','uBP'].forEach(function(n){BU[n]=bgl.getUniformLocation(bp,n);});
  }else{bgl=null;}
}
if(!bgl){cv.style.display='none';}

/* ================= SHADER SPRITE (teks + gambar) ================= */
var SVS=[
'attribute vec2 aP;uniform vec2 uRes,uC,uS;uniform float uRot;varying vec2 vUv;',
'void main(){vec2 p=(aP-.5)*uS;float c=cos(uRot),s=sin(uRot);',
' p=vec2(p.x*c-p.y*s,p.x*s+p.y*c);vec2 q=uC+p;',
' gl_Position=vec4(q.x/uRes.x*2.-1.,1.-q.y/uRes.y*2.,0.,1.);vUv=aP;}'
].join('\n');
var SFS=PREC+[
'uniform sampler2D uTex;',
'uniform float uT,uA,uReveal,uType,uSeed,uAsp,uGR,uHalo,uShadow;',
'uniform vec2 uTexel;varying vec2 vUv;',
'float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}',
'float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);',
' return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x),mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x),f.y);}',
'vec4 S(vec2 uv){return texture2D(uTex,uv);}',
'float ring(vec2 uv,float r){float s=0.;',
' for(int i=0;i<8;i++){float an=float(i)*.785398;s+=S(uv+vec2(cos(an),sin(an))*uTexel*r).a;}',
' return s*.125;}',
'float sparkle(vec2 uv,float t,float seed){',
' vec2 g=uv*vec2(26.*uAsp,26.)+seed*17.;vec2 id=floor(g);vec2 f=fract(g)-.5;',
' float h=hash(id);float tw=pow(max(0.,sin(t*(1.2+h*2.2)+h*50.)),20.);',
' return step(.9,h)*tw*smoothstep(.45,0.,length(f));}',
'void main(){',
' vec2 uv=vUv;vec4 o;',
' if(uType<.5){',
'  float m=clamp((uReveal*1.3-uv.x)/.3,0.,1.);',
'  float a=S(uv).a;',
'  float g=ring(uv,uGR)*.6+ring(uv,uGR*2.2)*.4;',
'  float flow=noise(vec2(uv.x*uAsp*.6+uT*.25,uv.y*2.+uSeed))*.5+.5*(.5+.5*sin(uv.x*4.-uT*.6));',
'  vec3 wine=vec3(.227,.051,.071),rose=vec3(.69,.33,.43);',
'  vec3 col=mix(wine,rose,smoothstep(.35,.95,flow)*.6);',
'  float pos=(uv.x+uv.y*.3)-(fract(uT*.14+uSeed*.31)*1.9-.45);',
'  float sheen=exp(-pos*pos*70.);',
'  col=mix(col,vec3(1.,.86,.7),sheen*.8);',
'  float sp=sparkle(uv,uT,uSeed)*smoothstep(0.,.6,a+g);',
'  col+=vec3(1.,.95,.85)*sp*1.3;',
'  float edge=m*(1.-m)*4.;col+=vec3(1.,.9,.8)*edge*.5;',
'  float ga=g*(1.-a)*.5;',
'  o=vec4(col*a+vec3(.88,.55,.65)*ga,a+ga);',
'  o*=m;',
' }else{',
'  vec2 w=vec2(sin(uv.y*9.+uT*1.3+uSeed),cos(uv.x*8.+uT*1.1+uSeed))*.003;',
'  vec4 c=S(uv+w);float a=c.a;',
'  float h=ring(uv,uGR);float hal=h*(1.-a);',
'  float sh=(S(uv+vec2(0.,-.035)).a+S(uv+vec2(.012,-.05)).a+S(uv+vec2(-.012,-.05)).a+S(uv+vec2(0.,-.07)).a)*.25*(1.-a);',
'  float inner=ring(uv,3.);float rim=clamp((a-inner)*2.2,0.,1.)*a;',
'  float pos=(uv.x*.8+uv.y*.6)-(fract(uT*.11+uSeed*.43)*2.6-.6);',
'  float sweep=exp(-pos*pos*40.);',
'  vec3 rgb=c.rgb*vec3(1.03,1.,.97)+vec3(1.,.93,.82)*(sweep*.28+rim*.22)*a;',
'  float sp=sparkle(uv,uT,uSeed)*smoothstep(0.,.5,hal+rim);',
'  vec3 hc=vec3(.95,.66,.74),sc=vec3(.23,.05,.07);',
'  o=vec4(rgb+hc*hal*uHalo+sc*sh*uShadow,a+hal*uHalo+sh*uShadow);',
'  o.rgb+=vec3(1.,.95,.85)*sp;o.a+=sp*.7;',
' }',
' gl_FragColor=o*uA;}'
].join('\n');

var fc=document.getElementById('fg'), fgl=null, ctx2=null, FU={};
try{ fgl=fc.getContext('webgl',{alpha:true,premultipliedAlpha:true,antialias:false})||fc.getContext('experimental-webgl'); }catch(e){}
if(fgl){
  var sp0=program(fgl,SVS,SFS);
  if(sp0){
    fgl.useProgram(sp0);
    var qb=fgl.createBuffer();fgl.bindBuffer(fgl.ARRAY_BUFFER,qb);
    fgl.bufferData(fgl.ARRAY_BUFFER,new Float32Array([0,0,1,0,0,1,1,1]),fgl.STATIC_DRAW);
    var ql=fgl.getAttribLocation(sp0,'aP');fgl.enableVertexAttribArray(ql);fgl.vertexAttribPointer(ql,2,fgl.FLOAT,false,0,0);
    ['uRes','uC','uS','uRot','uTex','uT','uA','uReveal','uType','uSeed','uAsp','uGR','uHalo','uShadow','uTexel'].forEach(function(n){FU[n]=fgl.getUniformLocation(sp0,n);});
    fgl.enable(fgl.BLEND);fgl.blendFunc(fgl.ONE,fgl.ONE_MINUS_SRC_ALPHA);
  }else{
    // shader gagal: pakai kanvas 2D biasa
    var nc=fc.cloneNode();fc.parentNode.replaceChild(nc,fc);fc=nc;fgl=null;
  }
}
if(!fgl){ctx2=fc.getContext('2d');}

/* ================= TEKSTUR ================= */
var sprites=[], K=20, SW=1000, SL=0, STp=0, GS=1, GX=0, GY=0;

function cvs(w,h){var c=document.createElement('canvas');c.width=Math.max(2,Math.ceil(w));c.height=Math.max(2,Math.ceil(h));return c;}

function titleTex(first,rest,fs){
  var m=cvs(8,8).getContext('2d');
  var f1='400 '+(fs*1.3*K)+'px '+SCRIPT, f2='400 '+(fs*K)+'px '+SERIF;
  m.font=f1;var w1=m.measureText(first).width;
  m.font=f2;var w2=m.measureText(rest).width;
  var padX=fs*.35*K, base=fs*1.45*K;
  var c=cvs(w1+w2+padX*2,fs*2.4*K),x=c.getContext('2d');
  x.fillStyle='#fff';x.textBaseline='alphabetic';
  x.font=f1;x.fillText(first,padX,base);
  x.font=f2;x.fillText(rest,padX+w1,base);
  return {cv:c,inkW:(w1+w2)/K,padX:padX/K,base:base/K,bw:c.width/K,bh:c.height/K};
}
function nameTex(txt,fs){
  var m=cvs(8,8).getContext('2d');
  m.font='700 '+(fs*K)+'px '+SERIF;
  var chars=txt.toUpperCase().split(''), sp=fs*.28*K;
  var ws=chars.map(function(ch){return m.measureText(ch).width;});
  var total=ws.reduce(function(a,b){return a+b;},0)+sp*(chars.length-1);
  var padX=fs*.4*K, base=fs*1.3*K;
  var c=cvs(total+padX*2,fs*1.9*K),x=c.getContext('2d');
  x.fillStyle='#fff';x.font='700 '+(fs*K)+'px '+SERIF;x.textBaseline='alphabetic';
  var cx=padX;chars.forEach(function(ch,i){x.fillText(ch,cx,base);cx+=ws[i]+sp;});
  return {cv:c,inkW:total/K,padX:padX/K,base:base/K,bw:c.width/K,bh:c.height/K};
}
function tagTex(txt,fs){
  var m=cvs(8,8).getContext('2d');
  m.font='italic 500 '+(fs*K)+'px '+ITAL;
  var w=m.measureText(txt).width, padX=fs*.6*K, base=fs*1.5*K;
  var c=cvs(w+padX*2,fs*2.2*K),x=c.getContext('2d');
  x.fillStyle='#fff';x.font='italic 500 '+(fs*K)+'px '+ITAL;x.textBaseline='alphabetic';
  x.fillText(txt,padX,base);
  return {cv:c,inkW:w/K,padX:padX/K,base:base/K,bw:c.width/K,bh:c.height/K};
}
function lineTex(wU,hU){
  var pad=.7*K, c=cvs(wU*K+pad*2,hU*K+pad*2),x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(pad,pad,wU*K,hU*K);
  return {cv:c,pad:pad/K,bw:c.width/K,bh:c.height/K};
}
function imgTex(img,hU,fadeBottom){
  var wU=hU*img.width/img.height, mu=1.8;
  var c=cvs((wU+mu*2)*K,(hU+mu*2)*K),x=c.getContext('2d');
  x.drawImage(img,mu*K,mu*K,wU*K,hU*K);
  if(fadeBottom){
    x.globalCompositeOperation='destination-out';
    var y0=(mu+hU*.82)*K,g=x.createLinearGradient(0,y0,0,(mu+hU)*K);
    g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,1)');
    x.fillStyle=g;x.fillRect(0,y0,c.width,c.height);
  }
  return {cv:c,w:wU,h:hU,m:mu,bw:c.width/K,bh:c.height/K};
}
function mkGL(cv){
  var t=fgl.createTexture();fgl.bindTexture(fgl.TEXTURE_2D,t);
  fgl.pixelStorei(fgl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,true);
  fgl.texImage2D(fgl.TEXTURE_2D,0,fgl.RGBA,fgl.RGBA,fgl.UNSIGNED_BYTE,cv);
  fgl.texParameteri(fgl.TEXTURE_2D,fgl.TEXTURE_MIN_FILTER,fgl.LINEAR);
  fgl.texParameteri(fgl.TEXTURE_2D,fgl.TEXTURE_MAG_FILTER,fgl.LINEAR);
  fgl.texParameteri(fgl.TEXTURE_2D,fgl.TEXTURE_WRAP_S,fgl.CLAMP_TO_EDGE);
  fgl.texParameteri(fgl.TEXTURE_2D,fgl.TEXTURE_WRAP_T,fgl.CLAMP_TO_EDGE);
  return t;
}
function tint(cv){ // untuk cadangan 2D
  var c=cvs(cv.width,cv.height),x=c.getContext('2d');
  x.drawImage(cv,0,0);x.globalCompositeOperation='source-in';x.fillStyle='#3a0d12';x.fillRect(0,0,c.width,c.height);
  return c;
}

var IMG={cat:null,letter:null,me:null};

function build(){
  var r=st.getBoundingClientRect();
  if(r.width<50)return;
  SW=r.width;SL=r.left;STp=r.top;
  K=Math.max(10,Math.min(36,SW/100*DPR));
  if(fgl)sprites.forEach(function(s){if(s.tex)fgl.deleteTexture(s.tex);});
  sprites=[];

  var FS=9.5, TS=.85, FIT=82, HU=100/1.45;
  var happy=titleTex('H','appy',FS*TS), bday=titleTex('B','irthday',FS*TS);
  var nm=nameTex('Vika Arianti',3.0);
  var tg=tagTex('"A little digital memory book built with love, just for you."',2.3);
  var ln=lineTex(nm.inkW-.8,.3);
  var cat=IMG.cat?imgTex(IMG.cat,17,true):null;
  var let_=IMG.letter?imgTex(IMG.letter,17.4,false):null;
  var me=IMG.me?imgTex(IMG.me,15,false):null;
  var catW=cat?cat.w:0, letW=let_?let_.w:0, meW=me?me.w+.6:0;

  // susunan (satuan: lebar layar / 100), titik awal kiri-atas
  var happyBase=15.4, catX=happy.inkW+2.0;
  var r2y=17.6, rx=letW+2.4;
  var bBase=r2y+11.0, nameBase=bBase+6.6, lineY=nameBase+1.4, tagBase=lineY+5.6;
  var gw=Math.max(catX+catW+meW,rx+bday.inkW), gh=tagBase+1.0;

  var gwRef=Math.max(happy.inkW/TS+2.0+catW,rx+bday.inkW/TS); // skala nama/surat/kucing tetap
  GS=Math.min(1.8,FIT/Math.max(gwRef,gw),.8*HU/gh);
  GX=50-GS*gw/2; GY=(HU-GS*gh)/2+.6;

  function add(o){sprites.push(o);}
  var P=function(t,x,y,o){o.cv=t.cv;o.x=x;o.y=y;o.w=t.bw;o.h=t.bh;return o;};

  if(let_)add(P(let_,-let_.m,r2y-let_.m,{type:1,seed:2.1,depth:1.2,start:1.6,dur:1.0,mode:'drop',fl:[.45,5,1],halo:.15,shadow:.4,gr:.5*K}));
  if(cat)add(P(cat,catX-cat.m,-cat.m,{type:1,seed:.7,depth:1.5,start:.9,dur:1.0,mode:'pop',fl:[.55,4,0],halo:.55,shadow:.12,gr:.55*K}));
  if(me)add(P(me,catX+catW+.6-me.m,2.6-me.m,{type:1,seed:1.4,depth:1.3,start:1.2,dur:1.0,mode:'pop',fl:[.5,4.5,2],halo:.3,shadow:.12,gr:.5*K}));
  add(P(happy,-happy.padX,happyBase-happy.base,{type:0,seed:.3,depth:.8,start:.2,dur:1.4,mode:'wipe',gr:.3*K}));
  add(P(bday,rx-bday.padX,bBase-bday.base,{type:0,seed:1.6,depth:.8,start:1.3,dur:1.5,mode:'wipe',gr:.3*K}));
  add(P(nm,rx-nm.padX,nameBase-nm.base,{type:0,seed:3.2,depth:.6,start:2.1,dur:.9,mode:'fade',alpha:1,gr:.2*K}));
  add(P(ln,rx-ln.pad,lineY-ln.pad,{type:0,seed:4.4,depth:.6,start:2.4,dur:1.0,mode:'line',gr:.25*K}));
  add(P(tg,gw/2-tg.inkW/2-tg.padX,tagBase-tg.base,{type:0,seed:5.3,depth:.4,start:2.9,dur:1.3,mode:'fade',alpha:.92,gr:.15*K}));

  sprites.forEach(function(s){
    s.asp=s.cv.width/s.cv.height;
    if(fgl)s.tex=mkGL(s.cv); else if(s.type===0)s.tcv=tint(s.cv);
  });
  if(aT0===null)aT0=performance.now();
}

/* ================= ANIMASI ================= */
function cl(v){return Math.max(0,Math.min(1,v));}
function ez(p){return p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;}
function eo(p){return 1-Math.pow(1-p,3);}
function eb(p){var c1=1.70158,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2);}
function anim(s,t){
  var r={a:0,sc:1,rot:0,dy:0,rev:1};
  if(t<s.start)return r;
  var p=cl((t-s.start)/s.dur);
  switch(s.mode){
    case 'wipe':r.a=1;r.rev=ez(p);r.dy=(1-eo(p))*1.2;break;
    case 'pop':r.a=Math.min(1,p*3);r.sc=.3+.7*eb(p);r.rot=-.35*(1-eo(p));break;
    case 'drop':r.a=Math.min(1,p*3);r.dy=-8*(1-eb(p));r.rot=-.21*(1-eo(p));break;
    case 'fade':r.a=p*(s.alpha||1);break;
    case 'line':r.a=1;r.rev=ez(p);break;
  }
  if(s.fl){var w=t*6.2832/s.fl[1]+s.fl[2];r.dy+=Math.sin(w)*s.fl[0]*p;r.rot+=Math.sin(w+1)*.02*p;}
  return r;
}

var tx=0,ty=0,cx0=0,cy0=0;
function drawFG(t){
  if(!sprites.length)return;
  var u=SW/100;
  if(fgl){
    fgl.viewport(0,0,fc.width,fc.height);
    fgl.clearColor(0,0,0,0);fgl.clear(fgl.COLOR_BUFFER_BIT);
    fgl.uniform2f(FU.uRes,fc.width,fc.height);
    fgl.uniform1f(FU.uT,t%600);
    fgl.uniform1i(FU.uTex,0);
  }else if(ctx2){
    ctx2.setTransform(1,0,0,1,0,0);ctx2.clearRect(0,0,fc.width,fc.height);
  }
  for(var i=0;i<sprites.length;i++){
    var s=sprites[i], an=anim(s,t);
    if(an.a<=.001)continue;
    var X=GX+GS*(s.x+s.w/2)+cx0*s.depth, Y=GY+GS*(s.y+s.h/2)+an.dy+cy0*s.depth;
    var cx=(SL+X*u)*DPR, cy=(STp+Y*u)*DPR;
    var sw=s.w*GS*u*DPR*an.sc, sh=s.h*GS*u*DPR*an.sc;
    if(fgl){
      fgl.bindTexture(fgl.TEXTURE_2D,s.tex);
      fgl.uniform2f(FU.uC,cx,cy);fgl.uniform2f(FU.uS,sw,sh);fgl.uniform1f(FU.uRot,an.rot);
      fgl.uniform1f(FU.uA,an.a);fgl.uniform1f(FU.uReveal,an.rev);fgl.uniform1f(FU.uType,s.type);
      fgl.uniform1f(FU.uSeed,s.seed);fgl.uniform1f(FU.uAsp,s.asp);fgl.uniform1f(FU.uGR,s.gr);
      fgl.uniform1f(FU.uHalo,s.halo||0);fgl.uniform1f(FU.uShadow,s.shadow||0);
      fgl.uniform2f(FU.uTexel,1/s.cv.width,1/s.cv.height);
      fgl.drawArrays(fgl.TRIANGLE_STRIP,0,4);
    }else if(ctx2){
      ctx2.save();ctx2.translate(cx,cy);ctx2.rotate(an.rot);ctx2.globalAlpha=an.a;
      if(s.type===0){ctx2.beginPath();ctx2.rect(-sw/2,-sh/2,sw*an.rev,sh);ctx2.clip();}
      ctx2.drawImage(s.type===0?s.tcv:s.cv,-sw/2,-sh/2,sw,sh);
      ctx2.restore();
    }
  }
}

/* ================= UKURAN + SENTUHAN ================= */
function resize(){
  W=innerWidth;H=innerHeight;
  if(bgl){
    var sc=Math.min(window.devicePixelRatio||1,1.5)*0.6; // naikkan ke 0.8 kalau mau lebih tajam
    cv.width=Math.max(2,Math.floor(W*sc));cv.height=Math.max(2,Math.floor(H*sc));
    bgl.viewport(0,0,cv.width,cv.height);
  }
  fc.width=Math.floor(W*DPR);fc.height=Math.floor(H*DPR);
}
var rzT=null;
window.addEventListener('resize',function(){resize();clearTimeout(rzT);rzT=setTimeout(build,150);});
resize();

function toP(x,y){var m=Math.min(W,H);return [(x-W/2)/m,-(y-H/2)/m];}
window.addEventListener('pointerdown',function(e){
  var p=toP(e.clientX,e.clientY);ptX=p[0];ptY=p[1];ptT=(performance.now()-t0)/1000;
});
window.addEventListener('pointermove',function(e){
  var p=toP(e.clientX,e.clientY);ptX=p[0];ptY=p[1];
  tx=(e.clientX/W-.5)*-.9;ty=(e.clientY/H-.5)*-.6;
});

function frame(now){
  var t=(now-t0)/1000;
  cx0+=(tx-cx0)*.06;cy0+=(ty-cy0)*.06;
  if(bgl){
    bgl.uniform2f(BU.uRes,cv.width,cv.height);bgl.uniform1f(BU.uTime,t);
    bgl.uniform3f(BU.uPt,ptX,ptY,t-ptT);bgl.uniform1f(BU.uBurst,t-buT);bgl.uniform2f(BU.uBP,bpX,bpY);
    bgl.drawArrays(bgl.TRIANGLES,0,3);
  }
  if(aT0!==null)drawFG((now-aT0)/1000);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ================= MUAT FONT + GAMBAR ================= */
function loadImg(src){return new Promise(function(res){var i=new Image();i.onload=function(){res(i);};i.onerror=function(){res(null);};i.src=src;});}
var fontsP=(document.fonts&&document.fonts.load)?Promise.all([
  document.fonts.load("100px 'Great Vibes'","HB"),
  document.fonts.load("100px 'Playfair Display'","appy"),
  document.fonts.load("700 100px 'Playfair Display'","VIKA"),
  document.fonts.load("italic 500 100px 'Cormorant Garamond'","A little")
]):Promise.resolve();
Promise.all([
  Promise.race([fontsP,new Promise(function(r){setTimeout(r,3000);})]),
  loadImg('kucing.png?v=10'),loadImg('surat.png?v=10'),loadImg('saya.png?v=10')
]).then(function(r){IMG.cat=r[1];IMG.letter=r[2];IMG.me=r[3];build();setTimeout(showP2,7000);});

/* ================= HALAMAN 2 ================= */
function showP2(){
  var p=document.getElementById('p2'), f=document.getElementById('fg');
  f.style.transition='opacity 1.2s ease';f.style.opacity='0';
  var s=p.querySelectorAll('.isi span');
  for(var i=0;i<s.length;i++)s[i].style.transitionDelay=(1.6+i*1.3)+'s';
  p.classList.add('on');
  for(var k=0;k<14;k++){var e=document.createElement('span');e.className='fl';e.textContent=k%3?'\u2665':'\u2726';
    e.style.left=(Math.random()*96)+'%';e.style.fontSize=(1.6+Math.random()*2.2)+'cqw';e.style.color=HC[k%HC.length];
    e.style.animationDuration=(7+Math.random()*6)+'s';e.style.animationDelay=(Math.random()*6)+'s';p.appendChild(e);}
}

/* ================= TOMBOL NEXT ================= */
var HC=['#8b1e2d','#c9808a','#d9a07c','#e7b6bf'];
function heart(cx,cy,i){
  var el=document.createElement('span');el.className='bh';el.textContent='\u2665';
  var u=st.clientWidth/100;
  el.style.left=cx+'px';el.style.top=cy+'px';
  el.style.fontSize=((1.6+Math.random()*1.8)*u)+'px';el.style.color=HC[i%HC.length];
  st.appendChild(el);
  var a=-Math.PI/2+(Math.random()-.5)*Math.PI*1.6, d=(7+Math.random()*13)*u, rot=(Math.random()-.5)*80;
  el.animate([
    {transform:'translate(-50%,-50%) scale(.3)',opacity:1},
    {transform:'translate(calc(-50% + '+(Math.cos(a)*d)+'px),calc(-50% + '+(Math.sin(a)*d)+'px)) scale(1) rotate('+rot+'deg)',opacity:0}
  ],{duration:1100+Math.random()*700,easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish=function(){el.remove();};
}
document.getElementById('next').addEventListener('click',function(){
  var r=this.getBoundingClientRect(), sr=st.getBoundingClientRect();
  var bx=r.left-sr.left+r.width/2, by=r.top-sr.top+r.height/2;
  for(var i=0;i<16;i++)heart(bx,by,i);
  var p=toP(r.left+r.width/2,r.top+r.height/2);bpX=p[0];bpY=p[1];
  buT=(performance.now()-t0)/1000;
  if(NEXT_URL){setTimeout(function(){location.href=NEXT_URL;},900);}
});

// matikan zoom
['gesturestart','gesturechange','gestureend'].forEach(function(e){
  document.addEventListener(e,function(ev){ev.preventDefault();});
});
document.addEventListener('touchmove',function(ev){if(ev.touches.length>1)ev.preventDefault();},{passive:false});
var lastTap=0;
document.addEventListener('touchend',function(ev){var n=Date.now();if(n-lastTap<350)ev.preventDefault();lastTap=n;},{passive:false});
</script>
