<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Happy Birthday Vika</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
    -webkit-text-size-adjust:none;text-size-adjust:none}
  html,body{height:100%;background:#f1eeea;color:#3a0d12;overflow:hidden;touch-action:manipulation}
  body{display:flex;align-items:center;justify-content:center}

  .stage{
    position:relative;
    width:min(100vw,calc(100dvh*9/16));
    height:min(100dvh,calc(100vw*16/9));
    container-type:inline-size;
    display:flex;align-items:center;justify-content:center;overflow:hidden
  }

  .next{position:absolute;top:calc(5cqw + env(safe-area-inset-top));right:5cqw;z-index:5;
    background:#3a0d12;color:#f1eeea;border:0;border-radius:999px;padding:1.8cqw 4.6cqw;
    font-family:'Playfair Display',Georgia,serif;font-size:3.8cqw;cursor:pointer}

  /* satu kolom, semuanya rata tengah */
  .content{width:80cqw;display:flex;flex-direction:column;align-items:center;
    text-align:center;transform-origin:center}

  .cat{height:36cqw;width:auto;display:block}

  .title{font-family:'Great Vibes',cursive;line-height:1;white-space:nowrap}
  .happy{font-size:22cqw;margin-top:2cqw}
  .bday{font-size:22cqw;margin-top:-3cqw}

  .letter{width:34cqw;height:auto;display:block;margin-top:5cqw}
  .name{font-family:'Special Elite',monospace;font-size:4.2cqw;letter-spacing:.3em;
    margin-top:3cqw;padding-left:.3em;white-space:nowrap}

  .tag{font-family:'Special Elite',monospace;font-size:3.2cqw;letter-spacing:.05em;
    line-height:1.7;opacity:.85;margin-top:6cqw}

  .content>*{opacity:0;animation:in .8s ease forwards}
  .cat{animation-delay:.1s}.happy{animation-delay:.4s}.bday{animation-delay:.6s}
  .letter{animation-delay:.9s}.name{animation-delay:1.1s}.tag{animation-delay:1.3s}
  @keyframes in{from{opacity:0;transform:translateY(2cqw)}to{opacity:1;transform:none}}

  .rotate{display:none;position:fixed;inset:0;z-index:99;background:#f1eeea;
    align-items:center;justify-content:center;text-align:center;padding:24px;
    font-family:'Playfair Display',Georgia,serif;font-size:18px}
  @media (orientation:landscape) and (max-height:600px){.rotate{display:flex}}
</style>
</head>
<body>
  <div class="stage" id="stage">
    <button class="next" id="next">Next</button>

    <div class="content" id="content">
      <img class="cat" src="kucing.png?v=5" alt="">
      <div class="title happy">Happy</div>
      <div class="title bday">Birthday</div>
      <img class="letter" src="surat.png?v=5" alt="">
      <div class="name">Vika Arianti</div>
      <p class="tag">"A little digital memory book<br>built with love, just for you."</p>
    </div>
  </div>

  <div class="rotate">Putar HP ke posisi tegak ya</div>

<script>
  try{ screen.orientation && screen.orientation.lock && screen.orientation.lock('portrait').catch(function(){}); }catch(e){}

  // pengaman: kalau isi lebih tinggi dari layar, otomatis dikecilkan
  var stage=document.getElementById('stage'), c=document.getElementById('content');
  function fit(){
    c.style.transform='none';
    var s=Math.min(1,(stage.clientHeight*0.92)/c.scrollHeight);
    c.style.transform='scale('+s+')';
  }
  window.addEventListener('load',fit);
  window.addEventListener('resize',fit);
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(fit);}
  Array.prototype.forEach.call(document.images,function(i){i.addEventListener('load',fit);});

  document.getElementById('next').addEventListener('click', function () {
    // window.location.href = 'next.html';
  });
</script>
</body>
</html>
