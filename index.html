<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Happy Birthday Vika</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
    -webkit-text-size-adjust:none;text-size-adjust:none}
  html,body{height:100%;background:#f1eeea;color:#3a0d12;overflow:hidden;touch-action:manipulation}
  body{display:flex;align-items:center;justify-content:center}

  /* kanvas 16:9, semua posisi dan ukuran dihitung dari lebarnya (cqw) */
  .stage{
    position:relative;
    width:min(100vw,calc(100dvh*16/9));
    height:min(100dvh,calc(100vw*9/16));
    container-type:inline-size;overflow:hidden
  }
  .stage>*{position:absolute}

  .next{top:4cqw;right:4cqw;z-index:5;background:#3a0d12;color:#f1eeea;border:0;
    border-radius:999px;padding:.7cqw 2.6cqw;font-family:'Playfair Display',Georgia,serif;
    font-size:2.2cqw;cursor:pointer}

  .title{font-family:'Playfair Display',Georgia,serif;line-height:1;white-space:nowrap}
  .sc{font-family:'Great Vibes',cursive;font-size:1.3em;line-height:.8;margin-right:.04em}

  .happy{left:17cqw;top:6.5cqw;font-size:10cqw}
  .cat{left:55cqw;top:8.5cqw;width:13cqw;height:15.5cqw;object-fit:cover;object-position:top;
    -webkit-mask-image:linear-gradient(#000 80%,transparent);mask-image:linear-gradient(#000 80%,transparent)}
  .bday{left:38.5cqw;top:25cqw;font-size:9.6cqw}
  .letter{left:17cqw;top:26.5cqw;width:20cqw;height:auto}
  .name{left:38.5cqw;top:39.5cqw;font-family:'Special Elite',monospace;font-size:2.5cqw;
    letter-spacing:.42em;white-space:nowrap}
  .tag{left:0;width:100cqw;top:50cqw;text-align:center;font-family:'Special Elite',monospace;
    font-size:1.7cqw;letter-spacing:.1em;white-space:nowrap;opacity:.85}

  .stage>*:not(.next){opacity:0;animation:in .9s ease forwards}
  .happy{animation-delay:.1s}.cat{animation-delay:.5s}.bday{animation-delay:.7s}
  .letter{animation-delay:1s}.name{animation-delay:1.3s}.tag{animation-delay:1.6s}
  @keyframes in{from{opacity:0;transform:translateY(1.5cqw)}to{opacity:1;transform:none}}

  .rotate{display:none;position:fixed;inset:0;z-index:99;background:#f1eeea;
    align-items:center;justify-content:center;text-align:center;padding:24px;
    font-family:'Playfair Display',Georgia,serif;font-size:20px;line-height:1.5}
  @media (orientation:portrait){.rotate{display:flex}.stage{display:none}}
</style>
</head>
<body>
  <div class="stage">
    <button class="next" id="next">Next</button>

    <div class="title happy"><span class="sc">H</span>appy</div>
    <img class="cat" src="kucing.png?v=6" alt="">
    <div class="title bday"><span class="sc">B</span>irthday</div>
    <img class="letter" src="surat.png?v=6" alt="">
    <div class="name">Vika Arianti</div>
    <p class="tag">"A little digital memory book built with love, just for you."</p>
  </div>

  <div class="rotate">Miringkan HP ke samping<br>(mode landscape) ya</div>

<script>
  try{ screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape').catch(function(){}); }catch(e){}
  document.getElementById('next').addEventListener('click', function () {
    // window.location.href = 'next.html';
  });
</script>
</body>
</html>
