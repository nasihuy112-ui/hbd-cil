<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Happy Birthday Vika</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;600;700&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
    -webkit-text-size-adjust:none;text-size-adjust:none;-webkit-user-select:none;user-select:none}
  html,body{height:100%;background:#f1eeea;color:#3a0d12;overflow:hidden;touch-action:none}
  body{display:flex;align-items:center;justify-content:center}

  /* kanvas 16:9, semua posisi dan ukuran dihitung dari lebarnya (cqw) */
  .stage{
    position:relative;
    width:min(100vw,calc(100dvh*16/9));
    height:min(100dvh,calc(100vw*9/16));
    container-type:inline-size;overflow:hidden;
    background:radial-gradient(circle at 50% 40%,#f7f4f0 0%,#f1eeea 60%,#e9e4de 100%)
  }
  .stage>*{position:absolute}

  .next{top:3.5cqw;right:3.5cqw;z-index:6;background:#3a0d12;color:#f1eeea;border:0;
    border-radius:999px;padding:.8cqw 2.8cqw;font-family:'Playfair Display',Georgia,serif;
    font-size:2.1cqw;cursor:pointer;animation:fadeIn 1s 2.4s both,pulse 2.4s 3.4s infinite}

  .title{font-family:'Playfair Display',Georgia,serif;line-height:1;white-space:nowrap;color:#3a0d12}
  .sc{font-family:'Great Vibes',cursive;font-size:1.3em;line-height:.8;margin-right:.03em;display:inline-block}
  .ch{display:inline-block;opacity:0;transform:translateY(2cqw);
    animation:letterIn .7s cubic-bezier(.2,.8,.2,1) forwards}

  .happy{left:25cqw;top:6cqw;font-size:11cqw}
  .cat-w{left:56.5cqw;top:3.5cqw;animation:pop 1s cubic-bezier(.3,1.4,.5,1) .9s both}
  .cat{height:23cqw;width:auto;display:block;animation:float 4s ease-in-out 2s infinite}
  .bday{left:42cqw;top:24.5cqw;font-size:10.5cqw;
    animation:wipe 1.3s cubic-bezier(.6,0,.2,1) 1.3s both}
  .letter-w{left:22.5cqw;top:25cqw;animation:drop 1s cubic-bezier(.3,1.3,.5,1) 1.6s both}
  .letter{width:19cqw;height:auto;display:block;animation:float 5s ease-in-out 2.8s infinite}

  .name-w{left:42cqw;top:38.5cqw;animation:fadeIn .8s 2s both}
  .name{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:3.5cqw;
    letter-spacing:.28em;text-transform:uppercase;white-space:nowrap;color:#3a0d12}
  .line{height:.28cqw;background:#3a0d12;margin-top:1cqw;width:0;
    animation:grow 1s ease 2.3s forwards}

  .tag{left:0;width:100cqw;top:49.5cqw;text-align:center;
    font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:500;
    font-size:2.5cqw;letter-spacing:.04em;white-space:nowrap;opacity:.9;
    animation:fadeIn 1.2s 2.8s both}

  /* hati kecil di latar */
  .p{bottom:-4cqw;pointer-events:none;opacity:0;animation:rise linear infinite}
  @keyframes rise{0%{opacity:0;transform:translateY(0) rotate(0)}10%{opacity:var(--o)}
    100%{opacity:0;transform:translateY(-62cqw) rotate(35deg)}}

  @keyframes letterIn{to{opacity:1;transform:none}}
  @keyframes pop{0%{opacity:0;transform:scale(.3) rotate(-20deg)}
    60%{opacity:1;transform:scale(1.1) rotate(5deg)}100%{opacity:1;transform:none}}
  @keyframes wipe{from{opacity:0;clip-path:inset(0 100% 0 0)}to{opacity:1;clip-path:inset(0 0 0 0)}}
  @keyframes drop{0%{opacity:0;transform:translateY(-8cqw) rotate(-12deg)}
    100%{opacity:1;transform:none}}
  @keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-.9cqw) rotate(1.5deg)}}
  @keyframes grow{to{width:100%}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

  .rotate{display:none;position:fixed;inset:0;z-index:99;background:#f1eeea;
    align-items:center;justify-content:center;text-align:center;padding:24px;
    font-family:'Playfair Display',Georgia,serif;font-size:20px;line-height:1.5}
  @media (orientation:portrait){.rotate{display:flex}.stage{display:none}}
</style>
</head>
<body>
  <div class="stage" id="stage">
    <button class="next" id="next">Next</button>

    <div class="title happy" id="happy"><span class="sc ch" style="animation-delay:.1s">H</span></div>
    <div class="cat-w"><img class="cat" src="kucing.png?v=7" alt=""></div>
    <div class="title bday"><span class="sc">B</span>irthday</div>
    <div class="letter-w"><img class="letter" src="surat.png?v=7" alt=""></div>
    <div class="name-w"><div class="name">Vika Arianti</div><div class="line"></div></div>
    <p class="tag">"A little digital memory book built with love, just for you."</p>
  </div>

  <div class="rotate">Miringkan HP ke samping<br>(mode landscape) ya</div>

<script>
  try{ screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape').catch(function(){}); }catch(e){}

  // huruf "appy" muncul satu per satu
  var h=document.getElementById('happy');
  'appy'.split('').forEach(function(c,i){
    var s=document.createElement('span');
    s.className='ch'; s.textContent=c; s.style.animationDelay=(0.3+i*0.12)+'s';
    h.appendChild(s);
  });

  // hati melayang di latar
  var st=document.getElementById('stage'), cols=['#8b1e2d','#c9808a','#d9b38c'];
  for(var i=0;i<16;i++){
    var p=document.createElement('div'); p.className='p'; p.textContent='\u2665';
    var sz=1.4+Math.random()*1.4;
    p.style.cssText='left:'+(Math.random()*96)+'cqw;font-size:'+sz+'cqw;color:'+cols[i%3]+
      ';--o:'+(0.25+Math.random()*0.3)+';animation-duration:'+(9+Math.random()*7)+
      's;animation-delay:'+(Math.random()*10)+'s';
    st.appendChild(p);
  }

  // matikan zoom (cubit dan ketuk dua kali)
  ['gesturestart','gesturechange','gestureend'].forEach(function(e){
    document.addEventListener(e,function(ev){ev.preventDefault();});
  });
  document.addEventListener('touchmove',function(ev){
    if(ev.touches.length>1)ev.preventDefault();
  },{passive:false});
  var last=0;
  document.addEventListener('touchend',function(ev){
    var n=Date.now(); if(n-last<350)ev.preventDefault(); last=n;
  },{passive:false});

  document.getElementById('next').addEventListener('click', function () {
    // window.location.href = 'next.html';
  });
</script>
</body>
</html>
