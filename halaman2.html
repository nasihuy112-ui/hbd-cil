<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Surat untuk Vika</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:none}
html,body{height:100%;overflow:hidden;background:#f8e9ec;font-family:'Playfair Display',Georgia,serif}
#bg,#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#bg{z-index:0}
#fx{z-index:6}
#fx.redup{z-index:2}

/* amplop */
#scene{position:fixed;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;perspective:900px;transition:opacity .8s,transform .8s}
#scene.pergi{opacity:0;transform:translateY(30vh) scale(.8);pointer-events:none}
#env{position:relative;width:min(58vw,92vh);aspect-ratio:1.6;margin-top:12vh;cursor:pointer;transform-style:preserve-3d;animation:masuk 1.6s cubic-bezier(.2,.9,.25,1.2) both}
#melayang{position:absolute;inset:0;animation:layang 4s ease-in-out infinite;transform-style:preserve-3d}
.lapis{position:absolute;inset:0}
#belakang{background:#e59db0;border-radius:10px;box-shadow:0 22px 50px rgba(150,60,90,.28),0 0 80px 20px rgba(255,255,255,.85)}
#kertas{position:absolute;left:6%;right:6%;top:8%;height:84%;background:#fffaf3;border-radius:6px;z-index:2;display:flex;align-items:center;justify-content:center;color:#6b1a2c;font:400 8vh 'Great Vibes',cursive;transition:transform 1s cubic-bezier(.3,.8,.2,1)}
#depan{z-index:3;border-radius:10px;overflow:hidden}
#depan i{position:absolute;inset:0}
#depan i:nth-child(1){background:#fbd9e1;clip-path:polygon(0 0,50% 56%,0 100%)}
#depan i:nth-child(2){background:#f9d1db;clip-path:polygon(100% 0,50% 56%,100% 100%)}
#depan i:nth-child(3){background:linear-gradient(#ffeaef,#f6c3d0);clip-path:polygon(0 100%,50% 46%,100% 100%)}
#tutup{position:absolute;left:0;right:0;top:0;height:60%;z-index:4;transform-origin:50% 0;transition:transform .8s ease-in-out}
#tutup i{position:absolute;inset:0;background:linear-gradient(#f3b9c8,#ffe3e9);clip-path:polygon(0 0,100% 0,50% 100%)}
#segel{position:absolute;left:50%;top:60%;width:18%;aspect-ratio:1;z-index:5;transform:translate(-50%,-50%);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#ffd9c9;font-size:6vh;background:radial-gradient(circle at 35% 30%,#b3354c,#6b1020 70%);box-shadow:0 4px 12px rgba(0,0,0,.4),inset 0 0 0 4px rgba(255,255,255,.12);animation:detak 1.3s ease-in-out infinite;transition:opacity .5s}
.buka #segel{opacity:0;animation:none}
.buka #tutup{transform:rotateX(180deg)}
.buka.lewat #tutup{z-index:1}
.keluar #kertas{transform:translateY(-62%)}
#petunjuk{position:absolute;bottom:3vh;width:100%;text-align:center;color:#8a2a44;font-size:4.2vh;letter-spacing:.05em;animation:kedip 1.8s ease-in-out infinite}

/* kucing */
#kucing{position:fixed;z-index:4;left:1vw;bottom:-3vh;height:48vh;pointer-events:none;transform:translateY(110%);transition:transform .9s cubic-bezier(.2,.9,.25,1.3)}
#kucing.ada{transform:none}
#kucing img,#kucing canvas{display:block;height:100%;width:auto}
#balon{position:fixed;z-index:5;left:2vw;bottom:47vh;max-width:30vw;padding:2.4vh 3vh;background:#fffaf6;color:#5a1422;border:2px solid #6b1a2c;border-radius:50% / 45%;text-align:center;font-weight:700;font-size:3.8vh;line-height:1.25;opacity:0;transform:scale(.2);transform-origin:20% 100%;transition:.45s cubic-bezier(.2,.9,.25,1.5)}
#balon.ada{opacity:1;transform:none}

/* surat */
#surat{position:fixed;z-index:3;left:50%;top:5vh;bottom:5vh;width:min(68vw,165vh);transform:translate3d(-50%,112vh,0);transition:transform 1.2s cubic-bezier(.2,.8,.2,1);pointer-events:none}
#surat.ada{transform:translate3d(-50%,0,0);pointer-events:auto}
#bingkai{position:absolute;left:-6vh;top:-6vh;width:calc(100% + 12vh);height:calc(100% + 12vh);pointer-events:none}
#surat.polos{background:#fff7f9;border:2px solid #efb3c2;border-radius:5vh}
#gulung{position:absolute;inset:3.2vh 2.4vh;overflow-y:auto;overscroll-behavior:contain;padding:2vh 4.5vw 10vh;touch-action:pan-y;scrollbar-width:none}
#gulung::-webkit-scrollbar{display:none}
#isi{color:#4a0f1f;font:700 5.1vh/1.65 'Nunito',system-ui,sans-serif}
#isi p{margin-bottom:3.4vh}
#judul{display:block;width:100%;height:auto;margin:0 0 3vh}
.h{display:inline-block;opacity:0;transform:translate3d(0,1.4vh,0);transition:opacity .55s ease-out,transform .55s ease-out}
.h.on{opacity:1;transform:none}
#lanjut{display:block;margin:3vh auto 0;padding:2.2vh 6vh;border:0;border-radius:99px;background:linear-gradient(135deg,#7d1f35,#3a0d12);color:#fff3ee;font:600 4.2vh 'Playfair Display',Georgia,serif;box-shadow:0 6px 24px rgba(168,84,106,.6);opacity:0;visibility:hidden;transform:scale(.6);transition:.6s cubic-bezier(.2,.9,.25,1.5)}
#lanjut.ada{opacity:1;visibility:visible;transform:none}

#kilat{position:fixed;inset:0;z-index:7;pointer-events:none;opacity:0;background:radial-gradient(circle,#fff,#ffd3dc 45%,transparent 75%)}
.putar{display:none;position:fixed;inset:0;z-index:99;background:#f8e9ec;color:#5a1422;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:20px;line-height:1.5}
@media (orientation:portrait){.putar{display:flex}}

@keyframes masuk{from{opacity:0;transform:translateY(-70vh) rotateY(360deg) scale(.2)}to{opacity:1;transform:none}}
@keyframes layang{50%{transform:translateY(-2.5vh) rotateX(6deg) rotateY(-7deg)}}
@keyframes detak{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.14)}}
@keyframes kedip{50%{opacity:.25}}
</style>
</head>
<body>
<canvas id="bg"></canvas>

<div id="scene">
  <div id="env"><div id="melayang">
    <div class="lapis" id="belakang"></div>
    <div id="kertas">for Vika</div>
    <div class="lapis" id="depan"><i></i><i></i><i></i></div>
    <div id="tutup"><i></i></div>
    <div id="segel">&#9829;&#xFE0E;</div>
  </div></div>
  <div id="petunjuk">tap segelnya ya</div>
</div>

<div id="kucing"></div>
<div id="balon"></div>

<div id="surat"><canvas id="bingkai"></canvas><div id="gulung">
  <div id="isi"></div>
  <button id="lanjut">Lanjut &#10140;</button>
</div></div>

<canvas id="fx"></canvas>
<div id="kilat"></div>
<div class="putar">Miringkan HP ke samping<br>(mode landscape) ya</div>

<script>
var NEXT_URL = ''; // isi nanti: 'halaman3.html'

var SURAT = [
'SELAMAT ULANG TAHUN SAYANGGG KUUU❤️❤️',
'maaf ya, aku telat ngucapinnya.',
'aku mau bilang makasih, kamu udah kuat sejauh ini, tahun ini ga gampang, banyak masalah yang kamu lewatin, tapi kamu tetap berusaha jalanin semuanya, i\'m so proud of you, makasih juga udah sabar ngadepin aku dan masih mau bertahan.',
'aku minta maaf soal kesalahan aku, waktu kita cuma ada di malam hari, tapi karena aku sibuk kerja dan suka ketiduran pas pulang, komunikasi kita jadi berantakan, maaf udah bikin kamu nunggu dan kecewa, kamu tetap penting buat aku, dan aku mau belajar lebih baik.',
'di umur yang baru ini, aku doain kamu selalu sehat dan dilindungi Allah. Semoga hati kamu lebih tenang, masalah kamu dimudahkan, rezeki kamu dilancarkan, dan apa yang kamu impikan bisa menjadi kenyataan. Semoga kamu juga lebih banyak bahagianya ya sayangg❤️',
'buat kita, semoga bisa makin saling ngerti, komunikasinya makin baik, dan hubungan kita dijaga. Insyaallah Januari 2027 nanti aku mau ketemu kamu. Semoga Allah lancarkan jalannya. Aamiin.',
'sekali lagi, selamat ulang tahun ya sayangg, i love you ❤️',
'kadonya nyusul ya, aku baru pesan di Shopee, jadi belum bisa nyampe hari ini, maaf yaa sayanggg😭'
];

function $(id){return document.getElementById(id);}
var mulai=performance.now(), bukaT=-99;

/* ===== SHADER: aurora, sinar, bokeh hati, ledakan cahaya ===== */
var bg=$('bg'), gl=bg.getContext('webgl',{alpha:false,antialias:false}), U={};
var FS=[
'#ifdef GL_FRAGMENT_PRECISION_HIGH\nprecision highp float;\n#else\nprecision mediump float;\n#endif',
'uniform vec2 R;uniform float T,B;',
'float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}',
'float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x),mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x),f.y);}',
'float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<3;i++){v+=a*noise(p);p=p*2.02+vec2(1.7,9.2);a*=.5;}return v;}',
'float bokeh(vec2 p,float sc,float spd,float seed){vec2 g=p*sc+vec2(seed*7.,-T*spd);vec2 id=floor(g);vec2 f=fract(g)-.5;',
' float h=hash(id+seed);vec2 off=(vec2(hash(id+1.3),hash(id+7.7))-.5)*.5;float rad=.08+.14*hash(id+3.1);float d=length(f-off);',
' float on=step(.55,h)*(.5+.5*sin(T*(.6+h*1.4)+h*6.28));return smoothstep(rad,rad*.2,d)*on*.16+smoothstep(rad*.35,0.,d)*on*.36;}',
'float heart(vec2 p){p.y-=.1;float x=abs(p.x);float y=p.y*1.15-sqrt(x)*.55;return length(vec2(x,y))-.45;}',
'float hati(vec2 p,float s,float v,float k){vec2 g=p*s+vec2(k,-T*v);vec2 id=floor(g),f=fract(g)-.5;float r=hash(id+k);',
' f.x+=sin(T*.7+r*6.28)*.1;float d=heart(f*(3.4+r*2.));return step(.82,r)*(smoothstep(.35,-.15,d)*.75+exp(-max(d,0.)*5.)*.25);}',
'void main(){vec2 uv=gl_FragCoord.xy/R;vec2 p=(gl_FragCoord.xy-.5*R)/min(R.x,R.y);float t=T*.06;',
' vec2 q=vec2(fbm(p*1.4+t),fbm(p*1.4+vec2(5.2,1.3)-t));',
' vec2 r=vec2(fbm(p*1.6+2.*q+vec2(1.7,9.2)+t*1.5),fbm(p*1.6+2.*q+vec2(8.3,2.8)-t));float f=fbm(p*1.2+2.5*r);',
' vec3 col=mix(vec3(.975,.925,.925),vec3(.97,.775,.835),smoothstep(.2,.72,f));',
' col=mix(col,vec3(.955,.88,.775),smoothstep(.5,.9,r.x)*.45);',
' col=mix(col,vec3(.93,.64,.73),smoothstep(.5,1.,q.y*f*1.7)*.45);',
' float w1=p.y+.18*sin(p.x*2.1+T*.35)+.12*(q.x-.5);float w2=p.y-.22*sin(p.x*1.6-T*.27)-.15*(r.y-.5);',
' col=mix(col,vec3(1.),exp(-pow((w1+.28)*9.,2.))*.4+exp(-pow((w2-.3)*11.,2.))*.35);',
' vec2 s=p-vec2(0.,.8);float a=atan(s.x,-s.y);float ray=noise(vec2(a*8.+T*.18,1.))*noise(vec2(a*15.-T*.13,4.));',
' col=mix(col,vec3(1.,.98,.95),ray*exp(-length(s)*.8)*.85);',
' col=mix(col,vec3(.95,.57,.68),hati(p,4.2,.2,1.)*.42);col=mix(col,vec3(1.),hati(p,6.5,.27,9.)*.7);',
' float d=length(p*vec2(.8,1.));col+=vec3(1.,.97,.95)*(.12+.04*sin(T*1.4))*exp(-d*d*2.2);',
' col+=vec3(1.,.93,.82)*(bokeh(p,5.,.05,0.)+bokeh(p,9.,.08,1.)+bokeh(p,14.,.12,2.));',
' vec2 g=p*18.+vec2(0.,-T*.25);vec2 id=floor(g),c=fract(g)-.5;float h=hash(id);',
' float st=exp(-abs(c.x)*40.)*exp(-abs(c.y)*8.)+exp(-abs(c.y)*40.)*exp(-abs(c.x)*8.)+exp(-dot(c,c)*90.);',
' col+=vec3(1.)*step(.93,h)*st*pow(max(0.,sin(T*1.6+h*60.)),8.);',
' float b=max(B,0.),dd=length(p);float ring=exp(-pow((dd-b*.8)*6.,2.))*exp(-b*1.1);',
' col+=step(0.,B)*(vec3(1.,.9,.93)*ring*.8+vec3(1.)*exp(-dd*1.6)*exp(-b*2.2)*.7);',
' vec2 vq=uv-.5;col*=1.-.16*dot(vq,vq)*2.;col+=(hash(gl_FragCoord.xy+fract(T))-.5)*.022;',
' gl_FragColor=vec4(clamp(col,0.,1.),1.);}'
].join('\n');
if(gl){
  var mk=function(type,src){var s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))console.warn(gl.getShaderInfoLog(s));return s;};
  var pr=gl.createProgram();
  gl.attachShader(pr,mk(gl.VERTEX_SHADER,'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}'));
  gl.attachShader(pr,mk(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);
  if(gl.getProgramParameter(pr,gl.LINK_STATUS)){
    gl.useProgram(pr);gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
    var loc=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
    U={R:gl.getUniformLocation(pr,'R'),T:gl.getUniformLocation(pr,'T'),B:gl.getUniformLocation(pr,'B')};
  }else{gl=null;}
}

/* ===== PARTIKEL: kelopak + hati ===== */
var fx=$('fx'), cx=fx.getContext('2d'), bagian=[];
function ukur(){
  bg.width=Math.floor(innerWidth*.5);bg.height=Math.floor(innerHeight*.5);
  if(gl)gl.viewport(0,0,bg.width,bg.height);
  fx.width=innerWidth;fx.height=innerHeight;
}
addEventListener('resize',ukur);ukur();
var WARNA=['#e86f8d','#f4a3b7','#ffffff','#d9a07c'];
function tambah(x,y,vx,vy,hati,umur){
  bagian.push({x:x,y:y,vx:vx,vy:vy,hati:hati,umur:umur,u:0,r:4+Math.random()*7,a:Math.random()*6.3,w:WARNA[Math.random()*4|0]});
}
function ledak(x,y,jml){
  for(var i=0;i<jml;i++){var a=Math.random()*6.283,v=2+Math.random()*9;
    tambah(x,y,Math.cos(a)*v,Math.sin(a)*v-3,Math.random()<.6,90+Math.random()*80);}
}
function gambar(b){
  cx.save();cx.translate(b.x,b.y);cx.rotate(b.hati?Math.sin(b.a)*.4:b.a);
  cx.globalAlpha=Math.max(0,Math.min(1,(b.umur-b.u)/40))*.85;cx.fillStyle=b.w;cx.beginPath();
  var r=b.r;
  if(b.hati){cx.moveTo(0,r);cx.bezierCurveTo(-r*1.6,-r*.2,-r*.8,-r*1.3,0,-r*.4);cx.bezierCurveTo(r*.8,-r*1.3,r*1.6,-r*.2,0,r);}
  else{r*=1.3;cx.moveTo(0,-r);cx.quadraticCurveTo(0,0,r,0);cx.quadraticCurveTo(0,0,0,r);cx.quadraticCurveTo(0,0,-r,0);cx.quadraticCurveTo(0,0,0,-r);}
  cx.fill();cx.restore();
}
var lalu=0, latarT=0, kotor=false;
function frame(now){
  var t=(now-mulai)/1000, dt=Math.min(3,(now-lalu)/16.7||1);lalu=now;
  if(now-latarT>=32){ // shader cukup 30 fps, jauh lebih ringan
    latarT=now;
    if(gl){gl.uniform2f(U.R,bg.width,bg.height);gl.uniform1f(U.T,t);gl.uniform1f(U.B,bukaT<0?-1:t-bukaT);gl.drawArrays(gl.TRIANGLES,0,3);}
    for(var k=0;k<hiasan.length;k++)hiasan[k](t);
  }
  if(bagian.length||kotor){
    cx.clearRect(0,0,fx.width,fx.height);
    for(var i=bagian.length-1;i>=0;i--){
      var b=bagian[i];b.u+=dt;
      b.vx*=.97;b.vy+=(1.2-b.vy)*.025*dt;
      b.x+=(b.vx+Math.sin(b.a)*.6)*dt;b.y+=b.vy*dt;b.a+=.035*dt;
      if(b.u>b.umur||b.y>fx.height+20)bagian.splice(i,1);else gambar(b);
    }
    kotor=bagian.length>0;
  }
  requestAnimationFrame(frame);
}

/* ===== SHADER BINGKAI, JUDUL, KUCING ===== */
var hiasan=[];
var KEPALA='#ifdef GL_FRAGMENT_PRECISION_HIGH\nprecision highp float;\n#else\nprecision mediump float;\n#endif\n'+
'uniform vec2 R;uniform float T,P,U;uniform sampler2D X;'+
'float hs(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}'+
'float ns(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hs(i),hs(i+vec2(1.,0.)),f.x),mix(hs(i+vec2(0.,1.)),hs(i+vec2(1.,1.)),f.x),f.y);}'+
'float kilau(vec2 g,float t){vec2 id=floor(g),c=fract(g)-.5;float h=hs(id);float s=exp(-abs(c.x)*22.)*exp(-abs(c.y)*5.)+exp(-abs(c.y)*22.)*exp(-abs(c.x)*5.);return step(.86,h)*s*pow(max(0.,sin(t*(1.2+h*2.)+h*60.)),10.);}';

function shaderDi(kanvas,frag){
  var g=kanvas.getContext('webgl',{alpha:true,premultipliedAlpha:true,antialias:false});
  if(!g)return null;
  var buat=function(j,src){var o=g.createShader(j);g.shaderSource(o,src);g.compileShader(o);
    if(!g.getShaderParameter(o,g.COMPILE_STATUS))console.warn('shader ERROR: '+g.getShaderInfoLog(o));return o;};
  var p=g.createProgram();
  g.attachShader(p,buat(g.VERTEX_SHADER,'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}'));
  g.attachShader(p,buat(g.FRAGMENT_SHADER,KEPALA+frag));g.linkProgram(p);
  if(!g.getProgramParameter(p,g.LINK_STATUS))return null;
  g.useProgram(p);g.bindBuffer(g.ARRAY_BUFFER,g.createBuffer());
  g.bufferData(g.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),g.STATIC_DRAW);
  var a=g.getAttribLocation(p,'a');g.enableVertexAttribArray(a);g.vertexAttribPointer(a,2,g.FLOAT,false,0,0);
  var u={};['R','T','P','U'].forEach(function(n){u[n]=g.getUniformLocation(p,n);});
  return {
    tekstur:function(sumber){
      g.bindTexture(g.TEXTURE_2D,g.createTexture());g.pixelStorei(g.UNPACK_PREMULTIPLY_ALPHA_WEBGL,true);
      g.texImage2D(g.TEXTURE_2D,0,g.RGBA,g.RGBA,g.UNSIGNED_BYTE,sumber);
      [g.TEXTURE_MIN_FILTER,g.TEXTURE_MAG_FILTER].forEach(function(n){g.texParameteri(g.TEXTURE_2D,n,g.LINEAR);});
      [g.TEXTURE_WRAP_S,g.TEXTURE_WRAP_T].forEach(function(n){g.texParameteri(g.TEXTURE_2D,n,g.CLAMP_TO_EDGE);});
    },
    gambar:function(t,P,satuan){
      g.viewport(0,0,kanvas.width,kanvas.height);
      g.uniform2f(u.R,kanvas.width,kanvas.height);g.uniform1f(u.T,t);g.uniform1f(u.P,P||0);g.uniform1f(u.U,satuan||1);
      g.drawArrays(g.TRIANGLES,0,3);
    }
  };
}

/* bingkai surat: kaca putih, garis cahaya pink-emas yang berputar */
(function(){
  var k=$('bingkai'), sh=shaderDi(k,
  'void main(){vec2 p=gl_FragCoord.xy-.5*R;float m=U*6.,rad=U*5.;'+
  'vec2 q=abs(p)-(.5*R-m-rad);float d=length(max(q,0.))+min(max(q.x,q.y),0.)-rad;'+
  'vec2 uv=gl_FragCoord.xy/R;float a=atan(p.y/R.y,p.x/R.x);'+
  'float isi=1.-smoothstep(-1.,1.,d);'+
  'float sutra=ns(uv*vec2(4.,3.)+vec2(T*.12,-T*.08)+ns(uv*3.-T*.05)*2.);'+
  'vec3 dasar=mix(vec3(1.,.985,.985),vec3(1.,.915,.94),sutra*.8);'+
  'float pita=exp(-pow((uv.x+uv.y*.45-fract(T*.11)*2.4+.4)*6.,2.));dasar=mix(dasar,vec3(1.),pita*.7);'+
  'dasar=mix(dasar,vec3(1.,.8,.87),exp(d/(U*5.))*.55);'+
  'vec3 warna=mix(vec3(.95,.5,.66),vec3(.98,.82,.6),.5+.5*sin(a*3.+T*1.1));warna=mix(warna,vec3(1.),pow(.5+.5*sin(a*2.-T*1.7),8.));'+
  'float garis=exp(-pow(d/(U*.45),2.));float dalam=exp(-pow((d+U*1.5)/(U*.16),2.))*.55;'+
  'float jalan=pow(max(0.,cos(a-T*1.2)),40.)+pow(max(0.,cos(a-T*1.2+3.14159)),40.);'+
  'float pendar=exp(-max(d,0.)/(U*1.8))*(1.-isi)*(.55+.12*sin(T*2.)+jalan*.5);'+
  'vec3 c=dasar;float al=isi*.96;'+
  'c=mix(c,warna,clamp(garis+dalam,0.,1.));al=max(al,garis);'+
  'if(isi<.5&&garis<.5){c=mix(vec3(1.,.72,.82),vec3(1.),jalan);al=max(garis,clamp(pendar,0.,.9));}'+
  'c+=vec3(1.,.96,.9)*jalan*exp(-pow(d/(U*1.1),2.))*.8;'+
  'float bintang=kilau(gl_FragCoord.xy/(U*5.),T)*exp(-abs(d)/(U*3.));c+=vec3(bintang);al=clamp(al+bintang,0.,1.);'+
  'gl_FragColor=vec4(clamp(c,0.,1.)*al,al);}');
  if(!sh){k.style.display='none';$('surat').classList.add('polos');return;}
  var skala=1;
  function pas(){skala=Math.min(devicePixelRatio||1,2)*.55;
    k.width=Math.round(k.offsetWidth*skala);k.height=Math.round(k.offsetHeight*skala);}
  pas();addEventListener('resize',pas);
  hiasan.push(function(t){if(sudah)sh.gambar(t,0,innerHeight/100*skala);});

/* judul: tulisan dengan shader seperti di tab 1 */
var judulMulai=-1;
function buatJudul(){
  var W=1200,H=290,t=document.createElement('canvas');t.width=W;t.height=H;
  var x=t.getContext('2d');x.fillStyle='#fff';x.textAlign='center';x.textBaseline='middle';
  [['SELAMAT ULANG TAHUN',82],['SAYANGGG KUUU\u2764\uFE0F\u2764\uFE0F',212]].forEach(function(b){
    var fs=96;do{x.font="700 "+fs+"px 'Playfair Display',Georgia,serif";fs-=2;}while(x.measureText(b[0]).width>W-70);
    x.fillText(b[0],W/2,b[1]);
  });
  var k=document.createElement('canvas');k.id='judul';k.width=900;k.height=Math.round(900*H/W);
  k.setAttribute('aria-label',SURAT[0]);
  var sh=shaderDi(k,
  'void main(){vec2 uv=vec2(gl_FragCoord.x/R.x,1.-gl_FragCoord.y/R.y);vec4 s=texture2D(X,uv);float a=s.a;'+
  'float g=0.;for(int i=0;i<8;i++){float an=float(i)*.785398;g+=texture2D(X,uv+vec2(cos(an),sin(an)*4.1)*.0065).a;}g*=.125;'+
  'float m=clamp((P*2.3-(uv.x+step(.5,uv.y)))/.3,0.,1.);'+
  'float fl=ns(vec2(uv.x*7.+T*.35,uv.y*3.));vec3 tinta=mix(vec3(.45,.05,.17),vec3(.82,.24,.43),smoothstep(.25,.85,fl));'+
  'float kil=exp(-pow((uv.x+uv.y*.2-(fract(T*.2)*1.9-.4))*9.,2.));tinta=mix(tinta,vec3(1.,.78,.66),kil*.85);'+
  'vec3 asli=s.rgb/max(a,.001);float emoji=step(.2,max(asli.r,max(asli.g,asli.b))-min(asli.r,min(asli.g,asli.b)));'+
  'vec3 warna=mix(tinta,asli,emoji);float halo=g*(1.-a)*(.6+.2*sin(T*2.));'+
  'vec3 c=warna*a+vec3(1.,.55,.7)*halo;float al=a+halo;'+
  'float bt=kilau(uv*vec2(26.,6.5),T)*smoothstep(0.,.3,g);c+=vec3(1.,.93,.85)*bt;al=clamp(al+bt,0.,1.);'+
  'float tepi=m*(1.-m)*4.;c+=vec3(1.,.7,.8)*tepi*a*.6;'+
  'gl_FragColor=vec4(c,al)*m;}');
  if(!sh){k.getContext&&(k=t,k.id='judul',x.globalCompositeOperation='source-atop',x.fillStyle='rgba(122,20,50,.9)',x.fillRect(0,0,W,H));return k;}
  sh.tekstur(t);
  hiasan.push(function(waktu){if(judulMulai>=0)sh.gambar(waktu,Math.min(1,(waktu-judulMulai)/2.4));});
  return k;
}

    'float g=0.,g2=0.;for(int i=0;i<8;i++){float an=float(i)*.785398;vec2 o=vec2(cos(an),sin(an)*R.x/R.y);'+
    'g+=texture2D(X,uv+o*.022).a;g2+=texture2D(X,uv+o*.05).a;}g*=.125;g2*=.125;'+
    'float halo=clamp(g*.8+g2*.5,0.,1.)*(1.-a)*(.75+.2*sin(T*2.2));'+

/* ===== MUNCUL PER KATA + SCROLL HALUS ===== */
var gulung=$('gulung'), sentuhT=-1e9;
['touchstart','touchmove','wheel','pointerdown'].forEach(function(e){
  gulung.addEventListener(e,function(){sentuhT=performance.now();},{passive:true});
});
function ikuti(el){ // geser sesekali pakai scroll halus bawaan HP
  if(performance.now()-sentuhT<3500)return;
  var g=gulung.getBoundingClientRect(), r=el.getBoundingClientRect();
  if(r.bottom>g.top+g.height*.82)gulung.scrollBy({top:r.bottom-(g.top+g.height*.55),behavior:'smooth'});
}
function siapkan(teks){ // kata disusun dulu (tersembunyi) supaya baris tidak loncat
  var p=document.createElement('p'), daftar=[];
  teks.split(' ').forEach(function(kata,i){
    if(i)p.appendChild(document.createTextNode(' '));
    var h=document.createElement('span');h.className='h';h.textContent=kata;p.appendChild(h);daftar.push(h);
  });
  $('isi').appendChild(p);
  return daftar;
}
function ketik(){
  var i=1;
  function paragraf(){
    if(i>=SURAT.length){selesai();return;}
    var daftar=siapkan(SURAT[i]), j=0;
    (function kata(){
      var el=daftar[j++], c=el.textContent, akhir=c.slice(-1);
      el.classList.add('on');ikuti(el);
      if(j<daftar.length)setTimeout(kata,akhir==='.'?750:(akhir===','?520:240));
      else{i++;setTimeout(paragraf,1000);}
    })();
  }
  var mulaiJudul=function(){
    $('isi').appendChild(buatJudul());judulMulai=(performance.now()-mulai)/1000;
    setTimeout(paragraf,2700);
  };
  var huruf=document.fonts&&document.fonts.load?document.fonts.load("700 96px 'Playfair Display'"):Promise.resolve();
  Promise.race([huruf,new Promise(function(r){setTimeout(r,1500);})]).then(mulaiJudul,mulaiJudul);
}
function selesai(){
  var tombol=$('lanjut');tombol.classList.add('ada');
  setTimeout(function(){ikuti(tombol);},650);
  setTimeout(function(){kucing.classList.add('ada');},900);
  ledak(innerWidth/2,innerHeight*.6,60);
}
$('lanjut').addEventListener('click',function(){
  meong();ledak(innerWidth/2,innerHeight*.7,60);
  if(NEXT_URL)setTimeout(function(){location.href=NEXT_URL;},900);
  else this.textContent='Bentar ya, lanjutannya lagi dibikin 😽';
});
